// nosfeik: custom new tab page (first line must be a comment)
try {
  const NEWTAB = "file:///home/nosfeik/.config/firefox-startpage/index.html";
  const { AboutNewTab } = ChromeUtils.importESModule("resource:///modules/AboutNewTab.sys.mjs");
  AboutNewTab.newTabURL = NEWTAB;
  // keep the urlbar focused and empty on the custom new tab
  Services.obs.addObserver(win => {
    try { if (win.gInitialPages && !win.gInitialPages.includes(NEWTAB)) win.gInitialPages.push(NEWTAB); } catch (e) {}
  }, "browser-delayed-startup-finished");
} catch (e) { Components.utils.reportError(e); }
